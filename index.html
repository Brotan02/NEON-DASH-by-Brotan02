<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Dash — наш ритм-раннер</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
<style>
:root{--bg:#0a0a1f;--fg:#eaf2ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a1f;--fg:#eaf2ff}}
:root[data-theme="dark"]{--bg:#0a0a1f;--fg:#eaf2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#c{display:block;width:100%;height:100%;cursor:pointer}
#q{position:fixed;left:50%;top:22%;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:14px 16px;max-width:92vw;background:#14143a;border:2px solid #3ef0ff;border-radius:12px;box-shadow:0 0 24px #3ef0ff55;z-index:5;font-family:'Russo One',system-ui,sans-serif;color:#eaf2ff}
#q[hidden]{display:none}
#q input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid #3ef0ff88;background:#0a0a1f;color:#eaf2ff;min-width:200px;-webkit-user-select:text;user-select:text}
#q button{font:inherit;padding:8px 14px;border-radius:8px;border:0;background:#3ef0ff;color:#0a0a1f;cursor:pointer}
#q button.x{background:#ffffff22;color:#eaf2ff}
</style>
</head>
<body>
<canvas id="c" aria-label="Игра Neon Dash: прыгай через шипы и пропасти"></canvas>
<div id="q" hidden><b id="qt"></b><input id="qi" maxlength="24" autocomplete="off"><button id="qo">OK</button><button id="qx" class="x">Отмена</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const H=420,GY=340,T=40,SPEED=340,GRAV=2800,JV=-790,PI2=Math.PI/2,FONT="'Russo One',system-ui,sans-serif";
let S=1,W=620,VH=H,dpr=1;
function fit(){dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.floor(cv.clientWidth*dpr));cv.height=Math.max(1,Math.floor(cv.clientHeight*dpr));S=Math.min(cv.height/H,cv.width/620);W=cv.width/S;VH=cv.height/S}
new ResizeObserver(fit).observe(cv);fit();

// ---------- уровень ----------
let obs=[],gaps=[],segs=[],END=0,seed=1;
const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const sp=x=>obs.push({t:'s',x,y:GY-T});
const bk=(x,n,h)=>obs.push({t:'b',x,y:GY-h*T,w:n*T,h:h*T});
const PAT=[
 [0,x=>{sp(x);return T}],
 [0,x=>{bk(x,1,1);return T}],
 [2,x=>{sp(x);sp(x+T);return 2*T}],
 [4,x=>{bk(x,3,1);return 3*T}],
 [6,x=>{gaps.push([x,x+2*T]);return 2*T}],
 [8,x=>{bk(x,3,1);sp(x+3*T);return 4*T}],
 [10,x=>{sp(x);sp(x+T);sp(x+2*T);return 3*T}],
 [12,x=>{bk(x,1,1);bk(x+T,2,2);return 3*T}],
 [14,x=>{gaps.push([x,x+3*T]);return 3*T}],
 [16,x=>{bk(x,2,2);sp(x+2*T);return 3*T}]
];
const LV=[
 {n:'Разгон',seed:20260,N:28,b:0,u:12,g0:6.4,g1:5.4,r:2,hue:210,tr:2},
 {n:'Пульс',seed:777,N:40,b:6,u:14,g0:5.4,g1:4.4,r:2,hue:290,tr:0},
 {n:'Закат',seed:31337,N:50,b:12,u:10,g0:4.8,g1:4,r:1.6,hue:15,tr:1}
];
let lv=0,cd=null,ck=0,admin=false,cust=[],testing=false,db=null,edM=new Map(),edG=new Set(),edI={},edT='s',ecx=-60,dr=null,lst=[],lmode='mine',lpg=0,lq='',lmsg='',nt='',nu=0;
const ov={},songs={};
const SK=[
 {n:'Неон',a:'#7dfcff',b:'#2b7bff',r:7,f:0},
 {n:'Лава',a:'#ffd23e',b:'#ff3d3d',r:2,f:1},
 {n:'Мята',a:'#b6ff8c',b:'#14b86a',r:20,f:2},
 {n:'Космос',a:'#c88cff',b:'#4b2bff',r:12,f:3},
 {n:'Сакура',a:'#ffc2e8',b:'#ff4fa8',r:16,f:4},
 {n:'Тень',a:'#aab4cc',b:'#232a40',r:0,f:5,fc:'#eaf2ff'}
];
function build(raw){
 const L=LV[lv],N=L.N;obs=[];gaps=[];segs=[];seed=L.seed;let x=14*T;
 for(let i=0;i<N;i++){
  const av=PAT.filter(p=>p[0]<=L.b+L.u*i/N),p=av[Math.floor(rnd()*av.length)];
  x+=p[1](x);x+=Math.round(L.g0+(L.g1-L.g0)*Math.min(1,i/N)+rnd()*L.r)*T;
 }
 END=x+6*T;
 let s=-3000;for(const [a,b] of gaps){segs.push([s,a]);s=b}segs.push([s,END+4000]);
 if(!raw&&ov[lv])loadData(ov[lv]);
}
build();

// ---------- звук ----------
let ac,mute=false;
function snd(f,d,type='square',v=.04,slide=0){
 if(mute)return;
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime,o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}

// ---------- музыка (синтез в браузере, без внешних файлов) ----------
const BEAT=160/SPEED,SD=BEAT/4,mtof=m=>440*2**((m-69)/12);
const bits=s=>[...s].map(Number),notes=s=>[...s].map(c=>c==='.'?-1:+c);
const TR=[
 {n:'Pulse',r:[[45,3],[41,4],[43,4],[40,3]],k:bits('1000100010001000'),s:bits('0000100000001000'),h:bits('0010001000100010'),b:bits('1001001010010010'),a:notes('0.1.2.1.3.2.1.0.'),lw:'square',lv:.045,bw:'sawtooth',bv:.2},
 {n:'Drive',r:[[50,3],[46,4],[48,4],[45,3]],k:bits('1000100110001010'),s:bits('0000100000001000'),h:bits('1010101010101011'),b:bits('1010101010101010'),a:notes('0123212301232132'),lw:'sawtooth',lv:.04,bw:'square',bv:.16},
 {n:'Chill',r:[[48,4],[43,4],[45,3],[41,4]],k:bits('1000001010000000'),s:bits('0000100000001000'),h:bits('1010101010101010'),b:bits('1000001010000100'),a:notes('0..2.1..3..2.1.2'),lw:'triangle',lv:.09,bw:'triangle',bv:.3}
];
let mg=null,nb;const mus={on:true,idx:0,run:false,next:0,step:0,t0:0};
function musFade(){if(mg&&ac){const o=mg;mg=null;o.gain.setTargetAtTime(0,ac.currentTime,.03);setTimeout(()=>{o.disconnect();if(o.src)try{o.src.stop()}catch(e){}},600)}}
function musSync(pos=0){
 musFade();
 if(!ac||!mus.on){mus.run=false;return}
 mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);
 const sb=cd&&cd.sn&&songs[cd.id];
 if(sb){const s=ac.createBufferSource();s.buffer=sb;s.loop=true;s.connect(mg);s.start(0,(pos/SPEED)%sb.duration);mg.src=s;mus.run=false;return}
 const st=Math.ceil(pos/40);mus.step=st;mus.next=ac.currentTime+.06+(st*40-pos)/SPEED;mus.t0=mus.next-st*SD;mus.run=true;
}
const musGo=()=>musSync(state==='play'?px:0);
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(!mg&&mus.on&&state!=='pause'&&state!=='dead')musGo()}catch(e){}}
function tone(f,t,d,type,v){const o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.value=f;n.gain.setValueAtTime(.0001,t);n.gain.linearRampToValueAtTime(v,t+.006);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(mg);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),n=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);n.gain.setValueAtTime(.55,t);n.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(n);n.connect(mg);o.start(t);o.stop(t+.22)}
function nz(t,d,v,hp){
 if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),n=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;
 n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(n);n.connect(mg);s.start(t);s.stop(t+d+.02);
}
function plan(s,t){
 const r=TR[mus.idx],k=s%16,[root,th]=r.r[Math.floor(s/16)%4];
 if(r.k[k])kick(t);if(r.s[k])nz(t,.14,.22,1500);if(r.h[k])nz(t,.04,.08,7000);
 if(r.b[k])tone(mtof(root),t,SD*1.8,r.bw,r.bv);
 const a=r.a[k];if(a>=0)tone(mtof(root+24+[0,th,7,12][a]),t,SD*.95,r.lw,r.lv);
}
setInterval(()=>{if(!ac||!mus.run||!mg)return;while(mus.next<ac.currentTime+.2){plan(mus.step,mus.next);mus.next+=SD;mus.step++}},30);

// ---------- состояние ----------
let state='menu',px,py,vy,grounded,rot,parts=[],held=false,attempts=0,best=0,deadT=0,lastPct=0,shake=0,pulse=0,lastBeat=-1,tAcc=0,bgs=0,menuBeat=-1,btns=[],skin=0;
const bests={};
try{const o=JSON.parse(localStorage.getItem('neondash.set')||'{}');if(o.m===false)mus.on=false;if(o.s===false)mute=true;if(o.l>=0&&o.l<LV.length)lv=o.l;if(o.k>=0&&o.k<=SK.length)skin=o.k;Object.assign(bests,o.b||{});admin=!!o.a;if(!admin&&skin>=SK.length)skin=0}catch(e){}
try{const x=JSON.parse(localStorage.getItem('neondash.lv')||'{}');cust=x.c||[];Object.assign(ov,x.o||{})}catch(e){}
(async()=>{try{db=(window.claude&&await claude.use('db'))||null}catch(e){}})();
ck=lv;mus.idx=LV[lv].tr;build();
try{best=+localStorage.getItem('neondash.best')||0}catch(e){}
function reset(){px=0;py=GY-T;vy=0;grounded=true;rot=0;parts=[];lastBeat=-1;shake=0}
function start(){reset();state='play';attempts++;musSync(0)}
reset();

function die(){
 state='dead';deadT=0;shake=1;musFade();
 lastPct=Math.floor(Math.min(1,px/END)*100);
 if(ck!=='t'&&lastPct>(bests[ck]|0)){bests[ck]=lastPct;save()}
 for(let i=0;i<32;i++){const a=Math.random()*6.28,v=120+Math.random()*320;
  parts.push({x:px+20,y:py+20,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,l:.8,m:.8,s:4+Math.random()*6,c:Math.random()<.5?(SK[skin]||CS).a:(SK[skin]||CS).b,g:1})}
 snd(240,.4,'sawtooth',.06,-190);
}
function win(){
 state='win';deadT=0;lastPct=100;if(ck!=='t'){bests[ck]=100;save()}
 for(let i=0;i<70;i++)parts.push({x:px+Math.random()*W*.5,y:-20,vx:(Math.random()-.5)*160,vy:60+Math.random()*200,l:2.2,m:2.2,s:5+Math.random()*5,c:['#3ef0ff','#ff3d9a','#ffd23e','#8cff5a'][i%4],g:1});
 [523,659,784,1046].forEach((f,i)=>setTimeout(()=>snd(f,.25,'triangle',.06),i*110));
}

function step(dt){
 if(held&&grounded){vy=JV;grounded=false;snd(520,.12,'square',.035,320)}
 const pb0=py+T;
 px+=SPEED*dt;vy+=GRAV*dt;py+=vy*dt;
 let on=false;
 const pl=px+4,pr=px+T-4,pb=py+T;
 const supported=!gaps.some(([a,b])=>pl>=a&&pr<=b);
 if(supported&&vy>=0&&pb>=GY){
  if(pb<=GY+14){py=GY-T;vy=0;on=true}else return die();
 }else if(pb>GY+60)return die();
 const L=px+4,R=px+T-4,Tp=py+4,B=py+T;
 for(const o of obs){
  const w=o.w||T;
  if(o.x>px+T+10||o.x+w<px-10)continue;
  if(o.t==='b'){
   if(R>o.x&&L<o.x+o.w&&B>o.y&&Tp<o.y+o.h){
    if(vy>=0&&pb0<=o.y+14){py=o.y-T;vy=0;on=true}else return die();
   }
  }else if(R>o.x+11&&L<o.x+29&&B>o.y+16&&Tp<o.y+T)return die();
 }
 grounded=on;
 if(!on)rot+=5.6*dt;else rot+=(Math.round(rot/PI2)*PI2-rot)*Math.min(1,dt*25);
 if(px>=END)win();
}

// ---------- мастерская: редактор, онлайн, очки ----------
const note=t=>{nt=t;nu=performance.now()+2600};
const persist=()=>{try{localStorage.setItem('neondash.lv',JSON.stringify({c:cust,o:ov}))}catch(e){}};
const pts=k=>{const b=bests[k]|0;return b*10+(b>=100?500:0)};
const clean=d=>({id:d.id,n:String(d.n||'Без названия').slice(0,24),hue:+d.hue||0,tr:(+d.tr|0)%3,sn:'',o:(Array.isArray(d.o)?d.o:[]).slice(0,3000).filter(a=>Array.isArray(a)&&(a[0]==='s'||a[0]==='b')&&a[1]>=0&&a[1]<3000&&a[2]>=0&&a[2]<=5).map(a=>[a[0],a[1]|0,a[2]|0]),g:(Array.isArray(d.g)?d.g:[]).slice(0,1500).map(Number).filter(c=>c>=0&&c<3000).map(c=>c|0)});
const [qd,qt,qi,qo,qx]=['q','qt','qi','qo','qx'].map(i=>document.getElementById(i));
function ask(t,v,cb){qd.hidden=false;qt.textContent=t;qi.value=v;qi.focus();qo.onclick=()=>{qd.hidden=true;cb(qi.value.trim())};qx.onclick=()=>{qd.hidden=true};qi.onkeydown=e=>{if(e.key==='Enter')qo.click()}}
function loadData(D){
 obs=[];gaps=[];segs=[];let mx=0;
 for(const [t,c,r] of D.o){mx=Math.max(mx,c);const x=c*T,y=GY-(r+1)*T;obs.push(t==='s'?{t:'s',x,y}:{t:'b',x,y,w:T,h:T})}
 for(const c of [...D.g].sort((a,b)=>a-b)){const l=gaps[gaps.length-1];if(l&&l[1]===c*T)l[1]+=T;else gaps.push([c*T,(c+1)*T]);mx=Math.max(mx,c)}
 END=Math.max(mx+10,60)*T;
 let s=-3000;for(const [a,b] of gaps){segs.push([s,a]);s=b}segs.push([s,END+4000]);
}
function toData(){
 const o=[],g=[];
 for(const b of obs){const c=Math.round(b.x/T);if(b.t==='s')o.push(['s',c,Math.round((GY-b.y-T)/T)]);else for(let i=0;i<b.w/T;i++)for(let j=0;j<b.h/T;j++)o.push(['b',c+i,Math.round((GY-b.y-b.h)/T)+j])}
 for(const [a,b] of gaps)for(let c=Math.round(a/T);c<Math.round(b/T);c++)g.push(c);
 return{o,g};
}
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('neondash',1);r.onupgradeneeded=()=>r.result.createObjectStore('s');r.onsuccess=()=>res(r.result);r.onerror=()=>rej()});
async function loadSong(id){
 if(songs[id])return songs[id];
 try{const d=await idb();const b=await new Promise(r=>{const q=d.transaction('s').objectStore('s').get(id);q.onsuccess=()=>r(q.result);q.onerror=()=>r()});if(b&&ac)songs[id]=await ac.decodeAudioData(b.slice(0))}catch(e){}
 return songs[id];
}
function pickSong(){
 const i=document.createElement('input');i.type='file';i.accept='audio/*';
 i.onchange=async()=>{const f=i.files[0];if(!f)return;audio();
  try{const b=await f.arrayBuffer();try{(await idb()).transaction('s','readwrite').objectStore('s').put(b.slice(0),edI.id)}catch(e){}
   songs[edI.id]=await ac.decodeAudioData(b);edI.sn=f.name.slice(0,24);note('Песня загружена: '+edI.sn)}catch(e){note('Не удалось прочитать файл')}};
 i.click();
}
const edExport=()=>({id:edI.id,n:edI.n,hue:edI.hue,tr:edI.tr,sn:edI.sn,o:[...edM].map(([k,t])=>{const [c,r]=k.split(',').map(Number);return[t,c,r]}),g:[...edG]});
const applyEd=()=>{cd=edExport();loadData(cd)};
function openEd(D,src,idx){
 edI={id:src==='c'?D.id:'l'+Date.now().toString(36),n:D.n||'Мой уровень',hue:D.hue??Math.floor(Math.random()*360),tr:D.tr||0,sn:D.sn||'',src,idx};
 edM=new Map(D.o.map(([t,c,r])=>[c+','+r,t]));edG=new Set(D.g);edT='s';ecx=-60;px=ecx+W*.28;
 state='edit';applyEd();musFade();mus.run=false;if(edI.sn)loadSong(edI.id);
}
function edTap(x,y){
 const wy=y-(VH-H)/2,c=Math.floor((x+ecx)/T),r=Math.floor((GY-wy)/T);
 if(c<6||y<92)return;
 if(edT==='g')edG.has(c)?edG.delete(c):edG.add(c);
 else if(r<0){if(edT==='e')edG.delete(c)}
 else if(r<=5)edT==='e'?edM.delete(c+','+r):edM.set(c+','+r,edT);
 applyEd();
}
function edTest(){testing=true;playLevel(edExport(),'t')}
function endTest(){testing=false;state='edit';px=ecx+W*.28;applyEd();musFade();mus.run=false}
function edSave(){ask('Название уровня',edI.n,v=>{edI.n=v||edI.n;const D=edExport();
 if(edI.src==='b')ov[edI.idx]=D;else{const i=cust.findIndex(z=>z.id===D.id);if(i<0)cust.push(D);else cust[i]=D}
 persist();note('Уровень сохранён')})}
function edExit(){cd=null;ck=lv;build();state='work';mus.idx=LV[lv].tr;musGo()}
function playLevel(D,key){cd=D;ck=key;loadData(D);attempts=0;mus.idx=D.tr||0;reset();start();if(D.sn)loadSong(D.id).then(()=>{if(state==='play')musGo()})}
function listMine(){lmode='mine';lst=cust.slice();lpg=0;lmsg=lst.length?'':'Пока пусто — создай свой уровень';state='list'}
async function listNet(q=''){
 lmode='net';lq=q;lst=[];lpg=0;state='list';
 if(!db){lmsg='Онлайн недоступен в этом режиме';return}
 lmsg='Загрузка…';
 try{const s=await db.collection('levels').orderBy('t','desc').limit(100).get();lst=s.docs.map(d=>clean({id:d.id,...d.data()})).filter(d=>d.o.length&&d.n.toLowerCase().includes(q.toLowerCase()));lmsg=lst.length?'':'Ничего не найдено'}catch(e){lmsg='Не удалось загрузить уровни'}
}
async function publish(it){
 if(!db)return note('Онлайн недоступен в этом режиме');
 try{await db.collection('levels').doc(it.id).set({n:it.n,hue:it.hue,tr:it.tr,o:it.o,g:it.g,t:Date.now()});note('Уровень опубликован онлайн')}catch(e){note('Нет прав на публикацию')}
}
function listScreen(){
 const tw=Math.min(W-40,560),x0=(W-tw)/2,per=4,np=Math.max(1,Math.ceil(lst.length/per));lpg=Math.min(lpg,np-1);
 lst.slice(lpg*per,lpg*per+per).forEach((it,i)=>{
  const y=VH/2-100+i*46,k=(lmode==='mine'?'c':'o')+it.id;let r=x0+tw;
  const add=(l,w,f)=>{btn(l,r-w,y,w,38,f,0,15);r-=w+6};
  if(lmode==='mine'){add('×',40,()=>{cust=cust.filter(c=>c.id!==it.id);persist();lst=lst.filter(z=>z!==it)});add('В сеть',84,()=>publish(it));add('Ред.',62,()=>openEd(it,'c'))}
  else{add('В мои',84,()=>{cust.push({...it,id:'l'+Date.now().toString(36)});persist();note('Добавлено в «Мои уровни»')});if(admin)add('Ред.',62,()=>openEd({...it},'n'))}
  btn(it.n+' · '+(bests[k]|0)+'%',x0,y,r-x0,38,()=>playLevel(it,k),1,15);
 });
 if(lmsg)text(lmsg,W/2,VH/2+96,15,'#ffd23e');
 const fy=VH/2+112;
 btn('Назад',x0,fy,110,38,()=>{state='work'},0,16);
 btn('◀',W/2-70,fy,60,38,()=>{lpg=Math.max(0,lpg-1)},0,16);btn('▶',W/2+10,fy,60,38,()=>{lpg=Math.min(np-1,lpg+1)},0,16);

   const b=Math.floor(px/160);
   if(b!==lastBeat){lastBeat=b;pulse=1}
   tAcc+=dt;if(tAcc>.025){tAcc=0;parts.push({x:px-2,y:py+T-6+Math.random()*6,vx:-60,vy:-20+Math.random()*40,l:.35,m:.35,s:6,c:(SK[skin]||CS).a,g:0})}
  }
 }else if(state==='dead'){
  deadT+=dt;if(deadT>.9)start();
 }else if(state==='win')deadT+=dt;
 if(state!=='play'&&ac&&mus.run&&mg){const b=Math.floor((ac.currentTime-mus.t0)/BEAT);if(b!==menuBeat){menuBeat=b;if(b>=0)pulse=1}}
 if(state==='menu'||state==='skins')bgs+=dt*170;
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=1400*dt;p.l-=dt}
 parts=parts.filter(p=>p.l>0);
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
