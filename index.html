<body>
<canvas id="c" aria-label="Игра Neon Dash: прыгай через шипы и пропасти"></canvas>
<div id="q" hidden><b id="qt"></b><input id="qi" maxlength="24" autocomplete="off"><button id="qo">OK</button><button id="qx" class="x">Отмена</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
const H=420,GY=340,T=40,SPEED=340,GRAV=2800,JV=-790,PI2=Math.PI/2,FONT="'Russo One',system-ui,sans-serif";
let S=1,W=620,VH=H,dpr=1;
function fit(){dpr=Math.min(devicePixelRatio||1,2);cv.width=Math.max(1,Math.floor(cv.clientWidth*dpr));cv.height=Math.max(1,Math.floor(cv.clientHeight*dpr));S=Math.min(cv.height/H,cv.width/620);W=cv.width/S;VH=cv.height/S}
new ResizeObserver(fit).observe(cv);fit();

// ---------- уровень ----------
let obs=[],gaps=[],segs=[],END=0,seed=1;
const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const HH={s:40,m:20,l:80,n:26},hz=(x,k='s')=>obs.push({t:'s',k,x,y:GY-HH[k],h:HH[k]}),sp=x=>hz(x,'s'),SP=[.75,1,1.35,1.7],CEIL=GY-6*T;
const bk=(x,n,h)=>obs.push({t:'b',x,y:GY-h*T,w:n*T,h:h*T});
const PAT=[
 [0,x=>{sp(x);return T}],
 [0,x=>{bk(x,1,1);return T}],
 [2,x=>{sp(x);sp(x+T);return 2*T}],
 [4,x=>{bk(x,3,1);return 3*T}],
 [6,x=>{gaps.push([x,x+2*T]);return 2*T}],
 [8,x=>{bk(x,3,1);sp(x+3*T);return 4*T}],
 [10,x=>{sp(x);sp(x+T);sp(x+2*T);return 3*T}],
 [12,x=>{bk(x,1,1);bk(x+T,2,2);return 3*T}],
 [14,x=>{gaps.push([x,x+3*T]);return 3*T}],
 [16,x=>{bk(x,2,2);sp(x+2*T);return 3*T}]
];
const LV=[
 {n:'Разгон',seed:20260,N:26,b:0,u:10,g0:6.4,g1:5.4,r:2,hue:210,tr:2},
 {n:'Пульс',seed:777,N:36,b:6,u:12,g0:5.4,g1:4.4,r:2,hue:290,tr:0,sp:[[.5,3],[.8,2]],sh:[.35]},
 {n:'Закат',seed:31337,N:44,b:10,u:12,g0:4.8,g1:4,r:1.6,hue:15,tr:1,sp:[[.25,3],[.55,4],[.8,2]],sh:[.4,.7]},
 {n:'Небо',seed:555,N:40,b:8,u:12,g0:5,g1:4.2,r:1.6,hue:190,tr:3,sh:[.2,.45,.7,.9]},
 {n:'Шторм',seed:9001,N:56,b:14,u:8,g0:4.6,g1:4,r:1.4,hue:330,tr:1,sp:[[.2,3],[.45,4],[.75,3]],sh:[.35,.6,.85]},
 {n:'Ад I',hc:1,seed:666,N:50,b:16,u:6,g0:4.2,g1:4,r:1,hue:0,tr:1,sp:[[.15,3],[.4,4],[.7,3]],sh:[.3,.55,.85]},
 {n:'Ад II',hc:1,seed:1313,N:62,b:18,u:4,g0:4.1,g1:4,r:.8,hue:340,tr:3,sp:[[.1,4],[.5,4],[.8,4]],sh:[.25,.5,.75,.9]},
 {n:'Ад III',hc:1,seed:4242,N:76,b:20,u:2,g0:4,g1:4,r:.6,hue:280,tr:0,sp:[[.1,4],[.3,3],[.6,4],[.85,4]],sh:[.2,.4,.6,.8,.92]}
];
const NL=5;
// ▼▼ НАСТРОЙКА СЕРВЕРА (Firebase): впиши apiKey и адрес базы, когда выкладываешь игру на свой сайт ▼▼
const FBCFG={key:'AIzaSyBtDGQNJAsIpgnyS-MZzvc8oYHDB1e3OWM',db:'https://neon-dash-675e8-default-rtdb.europe-west1.firebasedatabase.app/'};
let lv=0,cd=null,ck=0,admin=false,cust=[],testing=false,db=null,edM=new Map(),edG=new Set(),edI={},edT='s',ecx=-60,dr=null,lst=[],lmode='mine',lpg=0,lq='',lmsg='',nt='',nu=0,spg=0,mode=0,spd=1,jt=new Set(),hcs={},tstart=0,lvKeep=-1,ROOM=null,mp=null,mpMsg='',mpRes='',mpOppFin=0,lastSend=0,OYL=null,L2=0,undo=[],netMsg='',acct=null,frs=[],inb=[],fpg=0,seen=new Set(),pollT=0;
const ov={},songs={};
const SK=[
 {n:'Неон',a:'#7dfcff',b:'#2b7bff',r:7,f:0},
 {n:'Лава',a:'#ffd23e',b:'#ff3d3d',r:2,f:1},
 {n:'Мята',a:'#b6ff8c',b:'#14b86a',r:20,f:2},
 {n:'Космос',a:'#c88cff',b:'#4b2bff',r:12,f:3},
 {n:'Сакура',a:'#ffc2e8',b:'#ff4fa8',r:16,f:4},
 {n:'Тень',a:'#aab4cc',b:'#232a40',r:0,f:5,fc:'#eaf2ff'},
 {n:'Лёд',a:'#e6fbff',b:'#6fd3ff',r:10,f:6},
 {n:'Золото',a:'#fff3a8',b:'#d99a00',r:4,f:7,fc:'#3a2a00'},
 {n:'Малина',a:'#ff6aa0',b:'#7a1141',r:14,f:2},
 {n:'Лайм',a:'#eaff6a',b:'#4aa000',r:2,f:0},
 {n:'Океан',a:'#6ad4ff',b:'#0b3d91',r:18,f:8,fc:'#eaf2ff'},
 {n:'Руда',a:'#d9a066',b:'#5a3216',r:0,f:1},
 {n:'Призрак',a:'#ffffff',b:'#9aa6bd',r:20,f:8},
 {n:'Токсик',a:'#c6ff00',b:'#6a00ff',r:6,f:1},
 {n:'Заря',a:'#ffb36a',b:'#d1305a',r:12,f:4},
 {n:'Кибер',a:'#00ffd5',b:'#ff00aa',r:3,f:7},
 {n:'Тьма',a:'#4a4a6a',b:'#0a0a14',r:8,f:6,fc:'#ff3d3d'},
 {n:'Радуга',a:'#ff6ad5',b:'#6ad5ff',r:16,f:2}
];
const blk=(x,r)=>obs.push({t:'b',x,y:GY-(r+1)*T,w:T,h:T});
function shipSec(x){
 obs.push({t:'p',k:'2',x},{t:'p',k:'P',x:x+T});let c=x+5*T;
 for(let i=0;i<6;i++){const h=2+Math.floor(rnd()*2),fl=rnd()<.5;for(let j=0;j<h;j++)blk(c,fl?j:5-j);c+=(3+Math.floor(rnd()*2))*T}
 obs.push({t:'p',k:'C',x:c});return c+2*T-x;
}
PAT.push(
 [3,x=>{hz(x,'m');return T}],
 [5,x=>{hz(x,'n');hz(x+T,'n');return 2*T}],
 [11,x=>{hz(x,'l');return T}],
 [17,x=>{hz(x,'m');hz(x+T,'m');hz(x+2*T,'m');return 3*T}],
 [18,x=>{hz(x,'l');hz(x+3*T,'m');return 4*T}],
 [20,x=>{hz(x,'n');hz(x+T,'n');hz(x+2*T,'l');return 3*T}]
);
function build(raw){
 const L=LV[lv],N=L.N;obs=[];gaps=[];segs=[];seed=L.seed;let x=14*T,cs=1;
 for(let i=0;i<N;i++){
  for(const [f,t] of L.sp||[])if(i===Math.floor(N*f)){obs.push({t:'p',k:''+t,x});cs=SP[t-1];x+=2*T}
  if((L.sh||[]).some(f=>i===Math.floor(N*f))){cs=1;x+=shipSec(x)+4*T;continue}
  const av=PAT.filter(p=>p[0]<=L.b+L.u*i/N),p=av[Math.floor(rnd()*av.length)];
  x+=p[1](x);x+=Math.round((L.g0+(L.g1-L.g0)*Math.min(1,i/N)+rnd()*L.r)*cs)*T;
 }
 END=x+6*T;
 let s=-3000;for(const [a,b] of gaps){segs.push([s,a]);s=b}segs.push([s,END+4000]);
 if(!raw&&ov[lv])loadData(ov[lv]);
 mkJT();
}
build();

// ---------- звук ----------
let ac,mute=false;
function snd(f,d,type='square',v=.04,slide=0){
 if(mute)return;
 try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();
  const t=ac.currentTime,o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}
}

// ---------- музыка (синтез в браузере, без внешних файлов) ----------
const BEAT=160/SPEED,SD=BEAT/4,mtof=m=>440*2**((m-69)/12);
const bits=s=>[...s].map(Number),notes=s=>[...s].map(c=>c==='.'?-1:+c);
const TR=[
 {n:'Pulse',r:[[45,3],[41,4],[43,4],[40,3]],k:bits('1000100010001000'),s:bits('0000100000001000'),h:bits('0010001000100010'),b:bits('1001001010010010'),a:notes('0.1.2.1.3.2.1.0.'),lw:'square',lv:.045,bw:'sawtooth',bv:.2},
 {n:'Drive',r:[[50,3],[46,4],[48,4],[45,3]],k:bits('1000100110001010'),s:bits('0000100000001000'),h:bits('1010101010101011'),b:bits('1010101010101010'),a:notes('0123212301232132'),lw:'sawtooth',lv:.04,bw:'square',bv:.16},
 {n:'Chill',r:[[48,4],[43,4],[45,3],[41,4]],k:bits('1000001010000000'),s:bits('0000100000001000'),h:bits('1010101010101010'),b:bits('1000001010000100'),a:notes('0..2.1..3..2.1.2'),lw:'triangle',lv:.09,bw:'triangle',bv:.3},
 {n:'Back on Track',ab:'Back',r:[[50,3],[46,4],[53,4],[48,4]],k:bits('1000100010001000'),s:bits('0000100000001000'),h:bits('1010101110101011'),b:bits('0010001000100011'),a:notes('0121232101232121'),lw:'square',lv:.05,bw:'sawtooth',bv:.18}
];
let mg=null,nb;const mus={on:true,idx:0,run:false,next:0,step:0,t0:0};
function musFade(){if(mg&&ac){const o=mg;mg=null;o.gain.setTargetAtTime(0,ac.currentTime,.03);setTimeout(()=>{o.disconnect();if(o.src)try{o.src.stop()}catch(e){}},600)}}
function musSync(pos=0){
 musFade();
 if(!ac||!mus.on){mus.run=false;return}
 mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);
 const sb=cd&&cd.sn&&songs[cd.id];
 if(sb){const s=ac.createBufferSource();s.buffer=sb;s.loop=true;s.connect(mg);s.start(0,(pos/SPEED)%sb.duration);mg.src=s;mus.run=false;return}
 const st=Math.ceil(pos/40);mus.step=st;mus.next=ac.currentTime+.06+(st*40-pos)/SPEED;mus.t0=mus.next-st*SD;mus.run=true;
}
const musGo=()=>musSync(state==='play'?px:0);
function audio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();if(!mg&&mus.on&&state!=='pause'&&state!=='dead')musGo()}catch(e){}}
function tone(f,t,d,type,v){const o=ac.createOscillator(),n=ac.createGain();o.type=type;o.frequency.value=f;n.gain.setValueAtTime(.0001,t);n.gain.linearRampToValueAtTime(v,t+.006);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(mg);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),n=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);n.gain.setValueAtTime(.55,t);n.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(n);n.connect(mg);o.start(t);o.stop(t+.22)}
function nz(t,d,v,hp){
 if(!nb){nb=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),n=ac.createGain();s.buffer=nb;f.type='highpass';f.frequency.value=hp;
 n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(n);n.connect(mg);s.start(t);s.stop(t+d+.02);
}
function plan(s,t){
 const r=TR[mus.idx],k=s%16,bar=Math.floor(s/16),sec=Math.floor(bar/4)%2,[root,th]=r.r[bar%4];
 if(r.k[k])kick(t);if(r.s[k])nz(t,.14,.22,1500);if(r.h[k]||(sec&&k%2))nz(t,.04,.07,7000);
 if(bar%4===3&&k>=12)nz(t,.07,.1+(k-12)*.03,3000);
 if(k===0&&bar%4===0)nz(t,.6,.1,5000);
 if(r.b[k])tone(mtof(root),t,SD*1.8,r.bw,r.bv);
 const a=r.a[k];if(a>=0)tone(mtof(root+24+[0,th,7,12][a]+(sec?12:0)),t,SD*.95,r.lw,r.lv*(jt.size?.5:1));
 if(jt.has(s)){const sc=[0,th,7,12,12+th,19],m=root+24+sc[(s*5)%6];tone(mtof(m),t,SD*2.6,'triangle',.14);tone(mtof(m+12),t,SD*1.4,'sine',.06)}
}
setInterval(()=>{if(!ac||!mus.run||!mg)return;while(mus.next<ac.currentTime+.2){plan(mus.step,mus.next);mus.next+=SD/(state==='play'?spd:1);mus.step++}},30);

// ---------- состояние ----------
let state='menu',px,py,vy,grounded,rot,parts=[],held=false,attempts=0,best=0,deadT=0,lastPct=0,shake=0,pulse=0,lastBeat=-1,tAcc=0,bgs=0,menuBeat=-1,btns=[],skin=0;
const bests={};
try{const o=JSON.parse(localStorage.getItem('neondash.set')||'{}');if(o.m===false)mus.on=false;if(o.s===false)mute=true;if(o.l>=0&&o.l<NL)lv=o.l;if(o.k>=0&&o.k<200)skin=o.k;Object.assign(bests,o.b||{});admin=!!o.a;Object.assign(hcs,o.h||{})}catch(e){}
try{const x=JSON.parse(localStorage.getItem('neondash.lv')||'{}');cust=x.c||[];Object.assign(ov,x.o||{})}catch(e){}
resumeAcct().then(connect).then(ok=>{if(!ok)setTimeout(connect,5000)});
ck=lv;mus.idx=LV[lv].tr;build();
try{best=+localStorage.getItem('neondash.best')||0}catch(e){}
function reset(){px=tstart;py=GY-T;vy=0;grounded=true;rot=0;parts=[];lastBeat=-1;shake=0;mode=0;spd=1;if(tstart)for(const o of obs.filter(z=>z.t==='p'&&z.x<tstart).sort((a,b)=>a.x-b.x))portal(o.k)}
function start(){if(isHC()&&(hs(lv).u>=3||hs(lv).d))return;reset();state='play';attempts++;musSync(px)}
reset();

function die(){
 state='dead';deadT=0;shake=1;musFade();if(isHC()){hs(lv).u++;save()}
 lastPct=Math.floor(Math.min(1,px/END)*100);
 if(ck!=='t'&&lastPct>(bests[ck]|0)){bests[ck]=lastPct;save()}
 for(let i=0;i<32;i++){const a=Math.random()*6.28,v=120+Math.random()*320;
  parts.push({x:px+20,y:py+20,vx:Math.cos(a)*v,vy:Math.sin(a)*v-120,l:.8,m:.8,s:4+Math.random()*6,c:Math.random()<.5?skinObj(skin).a:skinObj(skin).b,g:1})}
 snd(240,.4,'sawtooth',.06,-190);
}
function win(){
 state='win';deadT=0;lastPct=100;if(ck!=='t'){bests[ck]=100;save()}
 if(isHC()){hs(lv).d=1;save()}
 if(mp&&mp.go){mp.r.presence({fin:1}).catch(()=>{});mpRes=mpOppFin?'Соперник был быстрее':'Ты победил!'}
 for(let i=0;i<70;i++)parts.push({x:px+Math.random()*W*.5,y:-20,vx:(Math.random()-.5)*160,vy:60+Math.random()*200,l:2.2,m:2.2,s:5+Math.random()*5,c:['#3ef0ff','#ff3d9a','#ffd23e','#8cff5a'][i%4],g:1});
 [523,659,784,1046].forEach((f,i)=>setTimeout(()=>snd(f,.25,'triangle',.06),i*110));
}

function stepOld(dt){
 if(held&&grounded){vy=JV;grounded=false;snd(520,.12,'square',.035,320)}
 const pb0=py+T;
 px+=SPEED*dt;vy+=GRAV*dt;py+=vy*dt;
 let on=false;
 const pl=px+4,pr=px+T-4,pb=py+T;
 const supported=!gaps.some(([a,b])=>pl>=a&&pr<=b);
 if(supported&&vy>=0&&pb>=GY){
  if(pb<=GY+14){py=GY-T;vy=0;on=true}else return die();
 }else if(pb>GY+60)return die();
 const L=px+4,R=px+T-4,Tp=py+4,B=py+T;
 for(const o of obs){
  const w=o.w||T;
  if(o.x>px+T+10||o.x+w<px-10)continue;
  if(o.t==='b'){
   if(R>o.x&&L<o.x+o.w&&B>o.y&&Tp<o.y+o.h){
    if(vy>=0&&pb0<=o.y+14){py=o.y-T;vy=0;on=true}else return die();
   }
  }else if(R>o.x+11&&L<o.x+29&&B>o.y+16&&Tp<o.y+T)return die();
 }
 grounded=on;
 if(!on)rot+=5.6*dt;else rot+=(Math.round(rot/PI2)*PI2-rot)*Math.min(1,dt*25);
 if(px>=END)win();
}

// ---------- мастерская: редактор, онлайн, очки ----------
const note=t=>{nt=t;nu=performance.now()+2600};
const persist=()=>{try{localStorage.setItem('neondash.lv',JSON.stringify({c:cust,o:ov}))}catch(e){}};
const pts=k=>{const b=bests[k]|0;return b*10+(b>=100?500:0)};
const clean=d=>({id:d.id,n:String(d.n||'Без названия').slice(0,24),hue:+d.hue||0,tr:(+d.tr|0)%4,sn:'',o:(Array.isArray(d.o)?d.o:[]).slice(0,3000).filter(a=>Array.isArray(a)&&/^[sbmlnPC1-4]$/.test(a[0])&&a[1]>=0&&a[1]<3000&&a[2]>=0&&a[2]<=9).map(a=>[a[0],a[1]|0,a[2]|0]),g:(Array.isArray(d.g)?d.g:[]).slice(0,1500).map(Number).filter(c=>c>=0&&c<3000).map(c=>c|0)});
const [qd,qt,qi,qo,qx]=['q','qt','qi','qo','qx'].map(i=>document.getElementById(i));
function ask(t,v,cb,pw){qd.hidden=false;qt.textContent=t;qi.type=pw?'password':'text';qi.value=v;qi.focus();qo.onclick=()=>{qd.hidden=true;cb(qi.value.trim())};qx.onclick=()=>{qd.hidden=true};qi.onkeydown=e=>{if(e.key==='Enter')qo.click()}}
function loadData(D){
 obs=[];gaps=[];segs=[];let mx=0;
 for(const [t,c,r] of D.o){mx=Math.max(mx,c);const x=c*T;
  if(t==='b')obs.push({t:'b',x,y:GY-(r+1)*T,w:T,h:T});
  else if(HH[t])obs.push({t:'s',k:t,x,y:GY-r*T-HH[t],h:HH[t]});
  else obs.push({t:'p',k:t,x})}
 for(const c of [...D.g].sort((a,b)=>a-b)){const l=gaps[gaps.length-1];if(l&&l[1]===c*T)l[1]+=T;else gaps.push([c*T,(c+1)*T]);mx=Math.max(mx,c)}
 END=Math.max(mx+10,60)*T;
 let s=-3000;for(const [a,b] of gaps){segs.push([s,a]);s=b}segs.push([s,END+4000]);
 mkJT();
}
function toData(){
 const o=[],g=[];
 for(const b of obs){const c=Math.round(b.x/T);if(b.t==='s')o.push([b.k||'s',c,Math.round((GY-b.y-b.h)/T)]);else if(b.t==='p')o.push([b.k,c,9]);else for(let i=0;i<b.w/T;i++)for(let j=0;j<b.h/T;j++)o.push(['b',c+i,Math.round((GY-b.y-b.h)/T)+j])}
 for(const [a,b] of gaps)for(let c=Math.round(a/T);c<Math.round(b/T);c++)g.push(c);
 return{o,g};
}

async function tok(){if(acct&&Date.now()>acct.exp)await refreshTok(acct.rt);return acct&&acct.idt}
async function fb(m,path,body){
 const t=await tok(),r=await fetch(FBCFG.db.replace(/[/]+$/,'')+'/'+path+'.json'+(t?'?auth='+t:''),{method:m,body:body===undefined?undefined:JSON.stringify(body)});

async function refreshTok(rt,nick){
 const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FBCFG.key,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(rt)});
 const j=await r.json();if(!j.id_token)throw new Error('refresh');
 acct={uid:j.user_id,nick:nick||acct.nick,idt:j.id_token,rt:j.refresh_token,exp:Date.now()+(+j.expires_in-60)*1000};
 try{localStorage.setItem('neondash.acct',JSON.stringify({nick:acct.nick,rt:acct.rt}))}catch(e){}
}
async function fbAuth(nick,pw,reg){

 const j=await r.json();if(j.error)throw new Error(j.error.message);
 acct={uid:j.localId,nick,idt:j.idToken,rt:j.refreshToken,exp:Date.now()+(+j.expiresIn-60)*1000};
 try{localStorage.setItem('neondash.acct',JSON.stringify({nick,rt:acct.rt}))}catch(e){}

 presence(){return Promise.resolve()},peers(){return[]},

  await loadPeer();

  if(host)peer.on('connection',hook);
  await new Promise((res,rej)=>{peer.on('error',rej);setTimeout(()=>rej(new Error('timeout')),12000);
   peer.on('open',()=>{if(host)return res();const c=peer.connect(pid);hook(c);c.on('open',()=>res())})});
  return{presence(p){Object.assign(me,p);if(conn&&conn.open)conn.send(p);return Promise.resolve()},peers(){const a=[{isMe:true,presence:me}];if(conn&&conn.open)a.push({isMe:false,presence:other});return a},onPeers(f){cbs.push(f)},leave(){try{peer.destroy()}catch(e){}}};
 }
};

function step(dt){

 const bo=sh?T-6:T,to=sh?10:4,lo=sh?6:4,pb0=py+bo;

 if(sh){vy+=(held?-1800:1500)*dt;vy=Math.max(-380,Math.min(380,vy))}else vy+=GRAV*dt;
 py+=vy*dt;
 let on=false;
 if(sh){
  if(py+bo>=GY){py=GY-bo;vy=0}
  if(py+to<=CEIL){py=CEIL-to;if(vy<0)vy=0}
 }else{
  const pl=px+4,pr=px+T-4,pb=py+T;
  const supported=!gaps.some(([a,b])=>pl>=a&&pr<=b);
  if(supported&&vy>=0&&pb>=GY){if(pb<=GY+14){py=GY-T;vy=0;on=true}else return die()}else if(pb>GY+60)return die();
 }
 const L=px+lo,R=px+T-lo,Tp=py+to,B=py+bo;
 for(const o of obs){
  const w=o.w||T;
  if(o.x>px+T+10||o.x+w<px-10)continue;
  if(o.t==='b'){
   if(R>o.x&&L<o.x+o.w&&B>o.y&&Tp<o.y+o.h){
    if(vy>=0&&pb0<=o.y+14){py=o.y-bo;vy=0;on=true}else return die();
   }
  }else if(o.t==='p'){
   if(R>o.x+8&&L<o.x+T-8)portal(o.k);
  }else{
   const a=o.k==='n'?4:12,y0=o.y+o.h*(o.k==='n'?.35:.4);
   if(R>o.x+a&&L<o.x+T-a&&B>y0&&Tp<o.y+o.h)return die();
  }
 }
 grounded=on;
 if(sh)rot=Math.max(-.5,Math.min(.5,vy/700));
 else if(!on)rot+=5.6*dt;else rot+=(Math.round(rot/PI2)*PI2-rot)*Math.min(1,dt*25);
 if(px>=END)win();
}

addEventListener('keyup',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code))release()});
cv.addEventListener('pointerdown',e=>{
 e.preventDefault();audio();
 const [x,y]=pt(e),b=btns.find(b=>x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h);
 if(b){b.fn();return}
 if(state==='paint'){dr={p:1};paintAt(x,y);return}
 if(state==='edit'){dr={x,y,c:ecx,m:0};return}
 if(['menu','skins','work','list','scores'].includes(state))return;
 press();
});
addEventListener('pointermove',e=>{if(!dr)return;if(dr.p){const [qx2,qy2]=pt(e);paintAt(qx2,qy2);return}const [x]=pt(e);if(Math.abs(x-dr.x)>8)dr.m=1;if(dr.m){ecx=Math.max(-60,dr.c-(x-dr.x));px=ecx+W*.28}});
addEventListener('pointerup',()=>{release();if(dr&&!dr.p&&!dr.m)edTap(dr.x,dr.y);dr=null});addEventListener('pointercancel',release);
addEventListener('blur',release);

// ---------- отрисовка ----------
function text(s,x,y,size,color,align='center',glow=0){
 g.font=size+'px '+FONT;g.textAlign=align;g.fillStyle=color;
 if(glow){g.shadowBlur=glow;g.shadowColor=color}
 g.fillText(s,x,y);g.shadowBlur=0;
}
function cube(k,i=skin){
 const s=typeof i==='object'?i:skinObj(i);g.save();g.scale(k,k);
 if(s.c&&s.sh){g.shadowBlur=14;g.shadowColor=s.a;g.imageSmoothingEnabled=false;g.drawImage(s.c,-20,-20,40,40);g.restore();return}
 if(s.c){g.shadowBlur=16;g.shadowColor=s.a;g.beginPath();g.roundRect(-20,-20,40,40,7);g.fillStyle='#0a0a1f';g.fill();g.shadowBlur=0;g.save();g.clip();g.imageSmoothingEnabled=false;g.drawImage(s.c,-20,-20,40,40);g.restore();g.strokeStyle='#fff';g.lineWidth=2;g.stroke();g.restore();return}
 g.shadowBlur=16;g.shadowColor=s.a;
 const pg=g.createLinearGradient(-20,-20,20,20);pg.addColorStop(0,s.a);pg.addColorStop(1,s.b);
 g.fillStyle=pg;g.beginPath();g.roundRect(-20,-20,40,40,s.r);g.fill();g.shadowBlur=0;
 g.strokeStyle='#fff';g.lineWidth=2;g.stroke();
 g.fillStyle=g.strokeStyle=s.fc||'#0a0a1f';g.lineWidth=3;
 switch(s.f){
  case 0:g.fillRect(-11,-9,8,9);g.fillRect(3,-9,8,9);g.fillRect(-10,9,20,3);break;
  case 1:g.beginPath();g.moveTo(-13,-12);g.lineTo(-3,-6);g.lineTo(-13,-2);g.fill();g.beginPath();g.moveTo(13,-12);g.lineTo(3,-6);g.lineTo(13,-2);g.fill();g.fillRect(-9,9,18,3);break;
  case 2:g.beginPath();g.arc(-8,-5,4,0,6.3);g.fill();g.beginPath();g.arc(8,-5,4,0,6.3);g.fill();g.beginPath();g.arc(0,2,9,.15*Math.PI,.85*Math.PI);g.stroke();break;
  case 3:g.fillRect(-15,-10,30,9);g.fillStyle=s.a;g.fillRect(-12,-8,10,5);break;
  case 4:g.fillRect(-12,-8,6,8);g.fillRect(6,-8,6,8);g.fillStyle='rgba(255,80,160,.7)';g.fillRect(-16,2,8,5);g.fillRect(8,2,8,5);break;
  case 6:g.beginPath();g.arc(0,-3,9,0,6.3);g.fillStyle='#fff';g.fill();g.fillStyle=s.fc||'#0a0a1f';g.beginPath();g.arc(2,-3,4.5,0,6.3);g.fill();g.fillRect(-8,10,16,3);break;
  case 7:g.fillRect(-16,-10,32,10);g.fillStyle='rgba(255,255,255,.7)';g.fillRect(-12,-8,6,3);g.fillRect(2,-8,6,3);g.fillStyle=s.fc||'#0a0a1f';g.fillRect(-6,9,12,3);break;
  case 8:g.fillRect(-13,-6,9,3);g.fillRect(4,-6,9,3);g.beginPath();g.arc(0,8,3,0,6.3);g.fill();break;
  default:g.beginPath();g.moveTo(-12,-10);g.lineTo(-4,-2);g.moveTo(-4,-10);g.lineTo(-12,-2);g.moveTo(4,-10);g.lineTo(12,-2);g.moveTo(12,-10);g.lineTo(4,-2);g.stroke();g.fillRect(-8,9,16,3);
 }
 g.restore();
}
function skinsScreen(){
 const cw=84,gp=14,cl=3,x0=(W-(cl*cw+(cl-1)*gp))/2,y0=VH/2-95,all=[...SK,...css],np=Math.ceil(all.length/6);spg=Math.min(spg,np-1);
 all.forEach((s,i)=>{if(Math.floor(i/6)!==spg)return;const ii=i%6;
  const x=x0+(ii%cl)*(cw+gp),y=y0+Math.floor(ii/cl)*104,on=i===skin;
  btns.push({x,y,w:cw,h:96,fn:()=>{skin=i;save()}});
  g.fillStyle=on?'rgba(62,240,255,.22)':'rgba(255,255,255,.1)';g.strokeStyle=on?'#3ef0ff':'rgba(255,255,255,.4)';g.lineWidth=2;
  g.beginPath();g.roundRect(x,y,cw,96,10);g.fill();g.stroke();
  g.save();g.translate(x+cw/2,y+38);cube(1,i);g.restore();
  text(s.n,x+cw/2,y+84,13,'#eaf2ff');
 });
 const my=skin>=SK.length&&css[skin-SK.length],bl=[['Назад',70,()=>{state='menu'}],['◀',38,()=>{spg=Math.max(0,spg-1)}],['▶',38,()=>{spg=Math.min(np-1,spg+1)}]];
 if(admin)bl.push(['Новый ✎',92,newSkin]);if(admin&&my)bl.push(['Править',88,editSkin]);if(my)bl.push(['Подарить',96,giftSkin]);bl.push(['Получить',88,recvGift]);
 const tot=bl.reduce((a,b)=>a+b[1]+6,-6);let bxx=(W-tot)/2;
 bl.forEach(b=>{btn(b[0],bxx,VH/2+122,b[1],36,b[2],0,14);bxx+=b[1]+6});
 text((spg+1)+' / '+np,W/2,VH/2+117,13,'rgba(234,242,255,.7)');
}
function btn(label,x,y,w,h,fn,hi,fs=20){
 btns.push({x,y,w,h,fn});
 g.fillStyle=hi?'rgba(62,240,255,.22)':'rgba(255,255,255,.1)';g.strokeStyle=hi?'#3ef0ff':'rgba(255,255,255,.4)';g.lineWidth=2;
 g.beginPath();g.roundRect(x,y,w,h,10);g.fill();g.stroke();
 text(label,x+w/2,y+h/2+fs*.35,fs,'#eaf2ff');
}
function draw1(){
 const prog=Math.min(1,px/END),h=((cd?cd.hue:LV[lv].hue)+prog*150)%360,acc=`hsl(${(h+150)%360} 100% 66%)`;
 const gr=g.createLinearGradient(0,0,0,cv.height);
 gr.addColorStop(0,`hsl(${h} 60% ${9+pulse*3}%)`);gr.addColorStop(1,`hsl(${(h+40)%360} 70% ${20+pulse*6}%)`);
 g.setTransform(1,0,0,1,0,0);g.fillStyle=gr;g.fillRect(0,0,cv.width,cv.height);
 const oy=OYL!==null?OYL:(VH-H)/2,sh=shake*8;
 g.setTransform(S,0,0,S,(Math.random()-.5)*sh*S,(oy+(Math.random()-.5)*sh)*S);
 const cx=px-W*.28;
 // фон: плывущие панели
 g.fillStyle=`hsla(${h} 80% 62% / .07)`;
 for(let i=0;i<14;i++){const m=W+240,sx=(((i*173-(cx+bgs)*.3)%m)+m)%m-120,z=40+(i*37%60);g.fillRect(sx,-oy+(i*91)%(VH-40),z,z)}
 // земля
 for(const [a,b] of segs){
  if(b<cx-50||a>cx+W+50)continue;
  g.fillStyle=`hsl(${h} 50% 7%)`;g.fillRect(a-cx,GY,b-a,1400);
  g.fillStyle=acc;g.fillRect(a-cx,GY,b-a,3);
 }
 // финиш
 if(END-cx<W+40){g.fillStyle='#ffd23e';g.shadowBlur=18;g.shadowColor='#ffd23e';g.fillRect(END-cx,-oy,6,GY+oy);g.shadowBlur=0}
 // блоки
 for(const o of obs){
  if(o.t!=='b'||o.x+o.w<cx-20||o.x>cx+W+20)continue;
  const x=o.x-cx;
  g.fillStyle=`hsl(${h} 55% 13%)`;g.fillRect(x,o.y,o.w,o.h);
  g.strokeStyle=acc;g.lineWidth=2;
  for(let i=0;i<o.w/T;i++)for(let j=0;j<o.h/T;j++)g.strokeRect(x+i*T+1,o.y+j*T+1,T-2,T-2);
  g.fillStyle=acc;g.fillRect(x,o.y,o.w,3);
 }
 if(mode===1&&state!=='edit'){g.fillStyle='hsl('+h+' 50% 7%)';g.fillRect(0,-oy-20,W,oy+20+CEIL);g.fillStyle=acc;g.fillRect(0,CEIL-3,W,3)}
 for(const o of obs){
  if(o.t!=='p'||o.x+T<cx-20||o.x>cx+W+20)continue;
  const x=o.x-cx+T/2,col=o.k==='P'?'#ff9d3d':o.k==='C'?'#3ef0ff':['#8cff5a','#ffd23e','#ff7a3d','#ff3d9a'][o.k-1]||'#fff';
  g.save();g.shadowBlur=14;g.shadowColor=col;g.strokeStyle=col;g.lineWidth=4;g.beginPath();g.ellipse(x,GY-110,14,110,0,0,6.3);g.stroke();g.restore();
  text(o.k==='P'?'✈':o.k==='C'?'■':o.k,x,GY-190,16,col);
 }
 // шипы
 g.shadowBlur=10;g.shadowColor='#ff3d9a';g.fillStyle='#ff3d9a';g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=2;
 for(const o of obs){
  if(o.t!=='s'||o.x+T<cx-20||o.x>cx+W+20)continue;
  const x=o.x-cx;
  const bt=o.y+o.h;if(o.k==='n')for(let i=0;i<3;i++){const nx=x+2+i*12;g.beginPath();g.moveTo(nx,bt);g.lineTo(nx+6,o.y+2);g.lineTo(nx+12,bt);g.closePath();g.fill();g.stroke()}else{g.beginPath();g.moveTo(x+2,bt);g.lineTo(x+T/2,o.y+3);g.lineTo(x+T-2,bt);g.closePath();g.fill();g.stroke()}
 }
 g.shadowBlur=0;
 // частицы
 for(const p of parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(p.x-cx-p.s/2,p.y-p.s/2,p.s,p.s)}
 g.globalAlpha=1;
 // игрок
 if(state!=='dead'&&state!=='edit'){
  g.save();g.translate(px-cx+T/2,py+T/2);g.rotate(rot);
  mode===1?ship():cube(1);
  g.restore();
 }
 if(L2)return;
 // HUD
 g.setTransform(S,0,0,S,0,0);
 btns=[];
 const bw=Math.min(W-40,320),bx=(W-bw)/2;
 g.fillStyle='rgba(255,255,255,.16)';g.beginPath();g.roundRect(bx,14,bw,10,5);g.fill();
 if(prog>0){g.fillStyle=acc;g.beginPath();g.roundRect(bx,14,Math.max(10,bw*prog),10,5);g.fill()}
 text(Math.floor(prog*100)+'%',W/2,48,16,'#eaf2ff');
 text('Попытка '+attempts+(isHC()?' / 3':''),14,24,14,'#eaf2ff','left');
 text('Лучший: '+(bests[ck]|0)+'%',W-14,24,14,'#eaf2ff','right');
 text('M — музыка · Esc — пауза',W-14,VH-12,12,'rgba(234,242,255,.6)','right');
 if(state==='play'){btns.push({x:W-46,y:36,w:34,h:34,fn:pause});g.fillStyle='rgba(255,255,255,.14)';g.beginPath();g.roundRect(W-46,36,34,34,8);g.fill();g.fillStyle='#eaf2ff';g.fillRect(W-35,44,5,18);g.fillRect(W-25,44,5,18)}
 const cy=VH/2-30;
 if(state==='menu'||state==='pause'){
  const m=state==='menu',bw2=Math.min(300,W-60),bx2=(W-bw2)/2;
  g.fillStyle='rgba(5,5,20,.82)';g.fillRect(0,0,W,VH);
  text(m?'NEON DASH':'Пауза',W/2,VH/2-140,Math.min(60,W/8),'#3ef0ff','center',24);
  const items=m?[['Играть',start,1],['Уровень: '+(lv+1)+' '+LV[lv].n,()=>setLevel(lv+1)],['Скины',()=>{state='skins';spg=Math.floor(skin/6)}],['Мастерская',()=>{state='work';connect()}]]
   :[['Продолжить',resume,1],['Заново',()=>{if(isHC()){hs(lv).u++;save();if(hs(lv).u>=3)return hcOver()}start()}],['В меню',toMenu]];
  items.forEach((b,i)=>btn(b[0],bx2,VH/2-95+i*48,bw2,40,b[1],b[2]));
  if(m){const hw=(bw2-8)/2,yy=VH/2-95+4*48;btn('Музыка: '+(mus.on?'вкл':'выкл'),bx2,yy,hw,40,toggleMusic,0,16);btn('Звуки: '+(mute?'выкл':'вкл'),bx2+hw+8,yy,hw,40,()=>{mute=!mute;save()},0,16)}
  text(m?(ac?'Пробел, ↑ или тап — прыжок':'Нажми куда угодно — включится музыка')+' · рекорд '+(bests[ck]|0)+'%':'Прогресс: '+Math.floor(prog*100)+'%',W/2,VH/2+168,14,'rgba(234,242,255,.7)');
 }else if(state==='skins'){
  g.fillStyle='rgba(5,5,20,.82)';g.fillRect(0,0,W,VH);
  text('Скины',W/2,VH/2-140,Math.min(60,W/8),'#3ef0ff','center',24);skinsScreen();
 }else if(state==='work'||state==='list'||state==='scores'||state==='edit'||state==='paint'||state==='hc'||state==='mp'||state==='fr'){
  extra(oy,cx);
 }else if(state==='dead'){
  text(lastPct+'%',W/2,cy+10,56,'#ff3d9a','center',20);
 }else if(state==='win'){
  text(mpRes||'Уровень пройден!',W/2,cy,Math.min(44,W/10),'#ffd23e','center',22);
  text('Попыток: '+attempts,W/2,cy+38,18,'#eaf2ff');
  if(deadT>.6){text('Нажми, чтобы сыграть снова',W/2,cy+68,14,'rgba(234,242,255,.75)');const nx=!cd&&lv<LV.length-1;btn('В меню',nx?W/2-150:W/2-70,cy+88,140,40,toMenu);if(nx)btn('Дальше',W/2+10,cy+88,140,40,()=>{setLevel(lv+1);start()},1)}
 }
if(nt&&performance.now()<nu)text(nt,W/2,VH-40,16,'#ffd23e','center',10);
}

// ---------- цикл ----------
let last=0;
function loop(t){
 const dt=Math.min(.033,(t-last)/1000||0);last=t;
 pulse=Math.max(0,pulse-dt*3);shake=Math.max(0,shake-dt*3);
 if(mp&&mp.go)mpSend();
 if(state==='play'){
  const n=Math.ceil(dt/(1/120));
  for(let i=0;i<n&&state==='play';i++)step(dt/n);
  if(state==='play'){
   const b=Math.floor(px/160);
   if(b!==lastBeat){lastBeat=b;pulse=1}
   tAcc+=dt;if(tAcc>.025){tAcc=0;parts.push({x:px-2,y:py+T-6+Math.random()*6,vx:-60,vy:-20+Math.random()*40,l:.35,m:.35,s:6,c:skinObj(skin).a,g:0})}
  }
 }else if(state==='dead'){
  deadT+=dt;if(deadT>.9){if(isHC()&&hs(lv).u>=3)hcOver();else start()}
 }else if(state==='win')deadT+=dt;
 if(state!=='play'&&ac&&mus.run&&mg){const b=Math.floor((ac.currentTime-mus.t0)/BEAT);if(b!==menuBeat){menuBeat=b;if(b>=0)pulse=1}}
 if(state==='menu'||state==='skins')bgs+=dt*170;
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.g)p.vy+=1400*dt;p.l-=dt}
 parts=parts.filter(p=>p.l>0);
 draw();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
